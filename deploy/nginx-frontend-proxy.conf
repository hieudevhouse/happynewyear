# Optional FE: static SPA + /api to Node on a DIFFERENT server.
# Use a private network/VPN for this HTTP upstream; restrict Node :4000
# to this FE server. Exactly one reverse proxy: TRUST_PROXY=1.
# Build frontend with VITE_API_BASE_URL=/api.
server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    root /srv/luckymoney/frontend/dist;
    index index.html;
    client_max_body_size 70m;

    location = /api { return 404; }
    location ^~ /api/ {
        # Replace this with the backend private address.
        # No trailing slash: retain /api in the upstream URI.
        proxy_pass http://10.0.0.20:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
